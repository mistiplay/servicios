<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistiplay - Tienda Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ========================================================
           1. COLORES Y ESTILO GENERAL DE LA PÁGINA
           ======================================================== */
        :root {
            --primary-blue: #00d2ff;
            --bg-dark: #090c10;
            --header-footer-bg: rgba(17, 24, 39, 0.95);
            --card-container-bg: rgba(26, 36, 52, 0.7);
            --card-bg: #151d28;
            --primary-green: #00ff88;
            --error-red: #ff3366;
            --text-light: #f1f5f9;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(-45deg, #090c10, #131a26, #0b1420, #05070a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ========================================================
           2. CABECERA (NAVBAR)
           ======================================================== */
        .navbar {
            background-color: var(--header-footer-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            height: 70px; 
            display: flex;
            align-items: center;
            padding: 0 25px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .nav-left { display: flex; align-items: center; }
        .main-icon { height: 45px; width: auto; }
        .v-separator { color: #333; font-size: 1.5rem; margin: 0 15px; }
        .tab-item { 
            color: white; text-decoration: none; font-weight: 800; 
            font-size: 1rem; position: relative; padding: 20px 0; text-transform: uppercase;
        }
        .tab-item::after { 
            content: ""; position: absolute; bottom: 5px; left: 0; 
            width: 100%; height: 3px; background-color: var(--primary-blue); 
            box-shadow: 0 0 10px var(--primary-blue); 
        }
        
        .nav-spacer { flex-grow: 1; }
        .nav-right { display: flex; align-items: center; }
        
        .social-links { display: flex; gap: 12px; margin-right: 20px; }
        .social-circle { 
            width: 38px; height: 38px; background-color: rgba(255,255,255,0.05); 
            border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; color: white; text-decoration: none; transition: 0.3s; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .social-circle:hover { background-color: var(--primary-blue); color: black; box-shadow: 0 0 15px var(--primary-blue); transform: translateY(-3px); }

        .search-box { position: relative; width: 280px; display: flex; align-items: center; }
        .search-input {
            width: 100%; background-color: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px; padding: 12px 45px 12px 20px; color: white; outline: none;
            font-family: 'Montserrat', sans-serif; transition: 0.3s;
        }
        .search-input:focus { border-color: var(--primary-blue); box-shadow: 0 0 12px rgba(0, 210, 255, 0.4); }
        .search-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--primary-blue); cursor: pointer; font-size: 1.1rem; }
        
        .currency-selector { background-color: rgba(255,255,255,0.1); color: white; display: flex; align-items: center; padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 0.8rem; gap: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .flag { width: 20px; height: 14px; background: linear-gradient(90deg, #d91023 33%, #fff 33%, #fff 66%, #d91023 66%); border: 1px solid #333; }

        /* ========================================================
           3. PORTADA Y BANNERS (SEPARADOS: PC VS MÓVIL)
           ======================================================== */
        /* Por defecto (PC): se muestran solo imágenes de PC */
        .img-pc { display: block !important; }
        .img-movil { display: none !important; }

        .full-width-section { 
            width: 100%; 
            background-color: #000; 
            position: relative; 
            border-bottom: 2px solid var(--primary-blue);
        }
        .hero-img { 
            width: 100%; 
            height: auto; 
            display: block; 
            max-width: 2560px; 
            margin: 0 auto; 
        }

        .promo-slider { 
            width: 100%; 
            overflow: hidden; 
            background-color: #000; 
            position: relative; 
            height: 400px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        } 
        .promo-track { 
            display: flex; 
            height: 100%; 
            transition: transform 0.6s ease; 
            width: 100%; 
        }
        .promo-slide { 
            min-width: 100%; 
            max-width: 100%; 
            height: 100%; 
            position: relative; 
            flex-shrink: 0;
        }
        .promo-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }
        
        .slider-arrow { 
            position: absolute; top: 50%; transform: translateY(-50%); 
            background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.2); 
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer; z-index: 10; transition: 0.3s; 
        }
        .slider-arrow:hover { background: var(--primary-blue); color: black; }
        .arrow-prev { left: 15px; } 
        .arrow-next { right: 15px; }

        .info-btn-promo { 
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); 
            background-color: var(--primary-green); color: black; padding: 12px 28px; 
            border-radius: 30px; font-size: 0.85rem; font-weight: 900; cursor: pointer; 
            border: none; text-transform: uppercase; z-index: 11; 
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); 
        }

        /* ========================================================
           4. CAJABOX / PRODUCTOS (SOLUCIÓN PRECIO DISPAREJO)
           ======================================================== */
        .main-container { max-width: 1300px; margin: 35px auto; width: 95%; box-sizing: border-box; }
        .services-box { 
            background-color: var(--card-container-bg); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 20px; padding: 35px; 
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .section-title { font-size: 1.6rem; font-weight: 900; color: white; text-transform: uppercase; margin-bottom: 10px; display: block; letter-spacing: 1px; }
        .section-divider { border: none; height: 2px; background: linear-gradient(90deg, var(--primary-blue), transparent); width: 100%; margin-bottom: 30px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }

        .card { 
            background-color: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); 
            cursor: pointer; transition: transform 0.3s ease, border-color 0.3s ease; 
            display: flex; flex-direction: column; opacity: 0; transform: translateY(20px); position: relative;
        }
        .card.is-visible { opacity: 1; transform: translateY(0); }
        .card.agotado { opacity: 0.5; filter: grayscale(100%); cursor: not-allowed; }
        
        .card-img-container { width: 100%; aspect-ratio: 1601/1656; overflow: hidden; background: #000; position: relative; }
        .card-img { width: 100%; height: 100%; object-fit: contain; display: block; }
        
        .status-badge { 
            position: absolute; top: 10px; right: 10px; z-index: 10;
            font-size: 0.65rem; padding: 4px 8px; border-radius: 6px; font-weight: 900; 
            text-transform: uppercase; display: inline-block;
        }
        .status-disponible { background-color: var(--primary-green); color: black; }
        .status-agotado { background-color: var(--error-red); color: white; }

        /* Estructura interna de la tarjeta */
        .card-body { padding: 14px; background-color: #0e1520; display: flex; flex-direction: column; gap: 8px; }
        .service-name { font-weight: 800; font-size: 1rem; color: white; display: block; }

        /* Fila de precio y botón: siempre juntos y alineados */
        .purchase-area { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%;
        }
        
        .price-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .price-label { font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; font-weight: 700; line-height: 1; }
        
        /* white-space: nowrap impide totalmente que S/ y el valor se separen */
        .price-value { 
            color: var(--primary-blue); 
            font-weight: 900; 
            font-size: 1.15rem; 
            white-space: nowrap; 
            line-height: 1.2;
        }
        
        .buy-btn { 
            background-color: var(--primary-blue); 
            color: black; 
            padding: 7px 12px; 
            border-radius: 6px; 
            font-size: 0.7rem; 
            font-weight: 900; 
            text-transform: uppercase; 
            white-space: nowrap;
        }

        /* ========================================================
           5. MODAL, FOOTER Y WHATSAPP
           ======================================================== */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .modal-container { position: relative; width: 75%; max-width: 320px; background: #1a1a1a; padding: 25px 15px; border-radius: 20px; text-align: center; border: 2px solid var(--primary-blue); }
        .modal-video { width: 100%; border-radius: 10px; display: block; margin-bottom: 20px; }
        .modal-buttons { display: flex; flex-direction: column; gap: 10px; }
        .btn-modal { display: flex; align-items: center; justify-content: center; gap: 10px; color: white; padding: 12px; border-radius: 8px; font-weight: 800; border: none; text-transform: uppercase; font-size: 0.8rem; cursor: pointer; text-decoration: none; }
        .btn-blue { background-color: #0077b6; } 
        .btn-green { background-color: var(--primary-green); color: black; font-weight: 900; }
        .btn-red { background-color: var(--error-red); }

        .wsp-container { position: fixed; bottom: 25px; right: 25px; z-index: 2000; display: flex; align-items: center; }
        .wsp-tooltip { background-color: rgba(0,0,0,0.8); color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-right: 10px; opacity: 0; visibility: hidden; transition: 0.3s; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); }
        .wsp-btn { width: 60px; height: 60px; display: block; }
        .wsp-btn img { width: 100%; height: 100%; display: block; }
        .wsp-container:hover .wsp-tooltip { opacity: 1; visibility: visible; }

        footer { background-color: var(--header-footer-bg); padding: 40px 0 25px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); }
        .footer-socials-mobile { display: none; gap: 20px; justify-content: center; margin-bottom: 20px; }
        .footer-socials-mobile a { color: white; font-size: 1.6rem; text-decoration: none; }
        .payment-container { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 15px; }
        .payment-label { color: #94a3b8; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; }
        .payment-img { height: 28px; width: auto; display: block; }

        /* ========================================================
           6. CONFIGURACIÓN EXCLUSIVA PARA MÓVIL (PANTALLAS CHICAS)
           ======================================================== */
        @media (max-width: 768px) {
            /* En móvil se apagan las de PC y se prenden solo las de móvil */
            .img-pc { display: none !important; }
            .img-movil { display: block !important; }

            .navbar { height: 60px; padding: 0 15px; justify-content: space-between; }
            .v-separator, .tab-item, .nav-spacer, .social-links, .currency-selector { display: none !important; }
            .nav-right { width: 75%; display: flex; justify-content: flex-end; }
            .search-box { width: 100%; max-width: 220px; }
            
            .promo-slider { height: 320px; }
            .main-container { margin: 15px auto; width: 95%; }
            .services-box { padding: 15px; }
            .section-title { font-size: 1.2rem; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .footer-socials-mobile { display: flex; } 

            /* Ajuste perfecto de cajabox en móvil */
            .card-body { padding: 10px; gap: 6px; }
            .service-name { font-size: 0.85rem; }
            .purchase-area { display: flex; flex-direction: row; justify-content: space-between; align-items: center; }
            .price-label { font-size: 0.55rem; }
            .price-value { font-size: 0.95rem; white-space: nowrap; }
            .buy-btn { padding: 5px 8px; font-size: 0.6rem; }

            .info-btn-promo { padding: 8px 18px; font-size: 0.7rem; bottom: 15px; }
            .wsp-btn { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <img src="icono.png" alt="Mistiplay" class="main-icon">
            <span class="v-separator">|</span>
            <a href="#" class="tab-item">Tienda</a>
        </div>
        <div class="nav-spacer"></div>
        <div class="nav-right">
            <div class="social-links">
                <a href="https://facebook.com/mistiplaygo" target="_blank" class="social-circle"><i class="fab fa-facebook-f"></i></a>
                <a href="https://instagram.com/mistiplaygo" target="_blank" class="social-circle"><i class="fab fa-instagram"></i></a>
                <a href="https://tiktok.com/@mistiplay" target="_blank" class="social-circle"><i class="fab fa-tiktok"></i></a>
            </div>
            <div class="search-box">
                <input id="search" type="text" class="search-input" placeholder="Buscar productos...">
                <button class="search-btn"><i class="fa fa-search"></i></button>
            </div>
            <span class="v-separator">|</span>
            <div class="currency-selector"><div class="flag"></div><span>PEN</span><i class="fa fa-chevron-down" style="font-size: 0.6rem; margin-left:8px;"></i></div>
        </div>
    </nav>

    <div class="full-width-section" id="seccion-portada">
        <img src="portada.jpg" class="hero-img img-pc" alt="" onerror="ocultarSeccionPortada()">
        <img src="portada_m.jpg" class="hero-img img-movil" alt="" onerror="ocultarSeccionPortada()">
    </div>

    <div class="promo-slider" id="seccion-promociones">
        <button class="slider-arrow arrow-prev" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></button>
        <button class="slider-arrow arrow-next" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></button>
        
        <div class="promo-track" id="promo-track">
            
            <div class="promo-slide">
                <img src="promo.jpg" class="promo-img img-pc" alt="" onerror="descartarSlide(this)">
                <img src="promo_m.jpg" class="promo-img img-movil" alt="" onerror="descartarSlide(this)">
            </div>

            <div class="promo-slide">
                <img src="promo2.jpg" class="promo-img img-pc" alt="" onerror="descartarSlide(this)">
                <img src="promo2_m.jpg" class="promo-img img-movil" alt="" onerror="descartarSlide(this)">
                <button class="info-btn-promo" onclick="openModal()">MÁS INFORMACIÓN</button>
            </div>

        </div>
    </div>

    <div class="overlay" id="videoModal">
        <div class="modal-container">
            <video id="modalVideo" class="modal-video" src="video.mp4" loop muted playsinline></video>
            <div class="modal-buttons">
                <button id="unmuteBtn" class="btn-modal btn-blue" onclick="toggleMute()"><i id="muteIcon" class="fas fa-volume-mute"></i> <span>Activar Sonido</span></button>
                <a href="https://wa.me/51923666291?text=Deseo%20mas%20informaci%C3%B3n%20MaxPlayer" target="_blank" class="btn-modal btn-green"><i class="fab fa-whatsapp"></i> MÁS INFORMACIÓN</a>
                <button class="btn-modal btn-red" onclick="closeModal()"><i class="fas fa-times"></i> CERRAR</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="services-box" id="seccion-tienda">
            <div class="section-header">
                <span class="section-title">Plataformas Streaming</span>
                <hr class="section-divider">
            </div>
            <div class="products-grid" id="grid-productos"></div>
        </div>
    </div>

    <div class="wsp-container">
        <div class="wsp-tooltip">¡Escríbenos en directo!</div>
        <a href="https://wa.me/51923666291?text=%C2%A1Hola%20Mistiplay!" target="_blank" class="wsp-btn">
            <img src="wsp.png" alt="WhatsApp">
        </a>
    </div>

    <footer>
        <div class="footer-socials-mobile">
            <p style="color: white; font-weight: 800; width: 100%; margin-bottom: 5px; font-size: 1.1rem;">Síguenos en:</p>
            <a href="https://facebook.com/mistiplaygo" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://instagram.com/mistiplaygo" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://tiktok.com/@mistiplay" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
        <div class="payment-container">
            <span class="payment-label">Métodos de pago aceptados:</span>
            <img src="metodosdepago.png" class="payment-img" alt="Métodos de pago">
        </div>
        <p style="color:#64748b; font-size:0.85rem; font-weight: 600; margin-top: 20px;">© 2025 MistiPlay. Todos los derechos reservados.</p>
    </footer>

    <script src="stock.js"></script>
    <script>
        /* ========================================================
           GUÍA VISIBLE 1: CONTROL INTELIGENTE DE IMÁGENES
           Si la imagen no existe en la carpeta, se apaga de inmediato.
           No fuerza a que la de PC se adapte al celular.
           ======================================================== */
        function ocultarSeccionPortada() {
            const sec = document.getElementById('seccion-portada');
            if (sec) sec.style.display = 'none';
        }

        function descartarSlide(imgElement) {
            const slide = imgElement.closest('.promo-slide');
            if (slide) {
                slide.remove();
                actualizarEstadoSlider();
            }
        }

        /* ========================================================
           GUÍA VISIBLE 2: CARRUSEL AUTOMÁTICO
           Detecta cuántas promociones quedan vivas y las desliza.
           ======================================================== */
        let currentSlide = 0;
        const track = document.getElementById('promo-track');

        function actualizarEstadoSlider() {
            const slider = document.getElementById('seccion-promociones');
            const slides = document.querySelectorAll('.promo-slide');
            if (slides.length === 0) {
                if (slider) slider.style.display = 'none';
            } else {
                if (slider) slider.style.display = 'block';
                currentSlide = currentSlide % slides.length;
                if (track) track.style.transform = `translateX(-${currentSlide * 100}%)`;
                const flechas = document.querySelectorAll('.slider-arrow');
                flechas.forEach(f => f.style.display = slides.length > 1 ? 'block' : 'none');
            }
        }

        function moveSlide(dir) { 
            const slides = document.querySelectorAll('.promo-slide');
            const total = slides.length;
            if (!track || total <= 1) return;
            currentSlide = (currentSlide + dir + total) % total; 
            track.style.transform = `translateX(-${currentSlide * 100}%)`; 
        }

        setInterval(() => {
            const slides = document.querySelectorAll('.promo-slide');
            if (slides.length > 1) moveSlide(1);
        }, 10000);

        actualizarEstadoSlider();

        /* ========================================================
           GUÍA VISIBLE 3: LISTADO DE PRODUCTOS Y PRECIOS
           Para cambiar precios o agregar productos, edita la lista:
           ======================================================== */
        const servicios = [
            {n: 'Netflix', p: '15.00', i: 'Netflix.jpg'},         
            {n: 'Disney+', p: '14.00', i: 'Disney.jpg'},         
            {n: 'HBO Max', p: '8.00', i: 'Max.jpg'},             
            {n: 'Paramount+', p: '8.00', i: 'Paramount.jpg'},    
            {n: 'Prime Video', p: '10.00', i: 'Primevideo.jpg'}, 
            {n: 'Vix Premium', p: '10.00', i: 'Vix.jpg'},         
            {n: 'Crunchyroll', p: '8.00', i: 'Crunchyroll.jpg'}, 
            {n: 'Apple TV+', p: '15.00', i: 'Apple.jpg'},         
            {n: 'Directv GO', p: '35.00', i: 'DGO.jpg'},          
            {n: 'Movistar TV', p: '25.00', i: 'Movistar.jpg'},    
            {n: 'Tele Latino', p: '20.00', i: 'Telelatino.jpg'},  
            {n: 'Flujo TV', p: '20.00', i: 'Flujotv.jpg'},        
            {n: 'MaxPlayer', p: '25.00', i: 'Maxplayer.jpg'},     
            {n: 'Canva Pro', p: '8.00', i: 'Canva.jpg'},          
            {n: 'CapCut Pro', p: '15.00', i: 'Capcut.jpg'},       
            {n: 'ChatGPT Plus', p: '15.00', i: 'Chat.jpg'},       
            {n: 'Spotify', p: '13.00', i: 'Spotify.jpg'},         
            {n: 'Youtube Premium', p: '15.00', i: 'Youtube.jpg'}  
        ];

        function render() {
            const grid = document.getElementById('grid-productos');
            grid.innerHTML = '';
            
            servicios.forEach((s) => {
                const status = typeof stockData !== 'undefined' ? (stockData[s.n] || 'disponible') : 'disponible';
                const cardHtml = `
                    <div class="card ${status==='agotado'?'agotado':''}" ${status==='agotado' ? '' : `onclick="window.open('https://wa.me/51923666291?text=Hola Mistiplay, deseo ${s.n}', '_blank')"`}>
                        <div class="card-img-container">
                            <div class="status-badge ${status==='agotado'?'status-agotado':'status-disponible'}">${status}</div>
                            <img src="${s.i}" class="card-img" alt="">
                        </div>
                        <div class="card-body">
                            <span class="service-name">${s.n}</span>
                            <div class="purchase-area">
                                <div class="price-wrapper">
                                    <span class="price-label">Precio</span>
                                    <span class="price-value">S/ ${s.p}</span>
                                </div>
                                <div class="buy-btn">Comprar</div>
                            </div>
                        </div>
                    </div>`;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });

            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.classList.add('is-visible');
                }, index * 60); 
            });
        }

        /* ========================================================
           GUÍA VISIBLE 4: BUSCADOR CON SALTO DIRECTO
           ======================================================== */
        let searchTimeout;
        document.getElementById('search').addEventListener('input', e => {
            const q = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(c => c.style.display = c.querySelector('.service-name').innerText.toLowerCase().includes(q) ? 'flex' : 'none');
            
            if (q.length > 0) {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    document.getElementById('seccion-tienda').scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 300);
            }
        });

        /* LÓGICA DEL MODAL */
        const modal = document.getElementById('videoModal');
        const video = document.getElementById('modalVideo');
        const muteIcon = document.getElementById('muteIcon');
        function openModal() { modal.style.display = 'flex'; video.play(); }
        function closeModal() { modal.style.display = 'none'; video.pause(); video.currentTime = 0; }
        function toggleMute() {
            video.muted = !video.muted;
            muteIcon.className = video.muted ? "fas fa-volume-mute" : "fas fa-volume-up";
            document.querySelector('#unmuteBtn span').innerText = video.muted ? "Activar Sonido" : "Desactivar Sonido";
        }

        render();
    </script>
</body>
</html>
